# The fast gate (G3, G38): one job on every PR and before every deploy, kept to about two minutes.
# The build comes first and the slowest checks last. The thorough checks are in
# checkpoint.yml. Actions are pinned to commit SHAs; the comment gives the release.
# Checkouts don't keep the GitHub token, so dependency code run by lint, test and build can't read it.
#
# A merge of docs alone starts no run and no deploy, because its PR already passed this gate.
name: CI

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'

permissions:
  contents: read

env:
  WRANGLER_SEND_METRICS: 'false'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Node comes from devEngines.runtime and pnpm from packageManager; this also runs the install.
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          cache: true
          require-lockfile: true
      - run: pnpm build
        env:
          # Only production builds count visits (G18). The token is public by design: it's in every page.
          PUBLIC_CF_ANALYTICS_TOKEN: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.CF_ANALYTICS_TOKEN || '' }}
      # Only main's build carries the beacon. An unset variable fails here, rather than silently
      # deploying a site that counts nobody.
      - name: Check the analytics beacon
        env:
          ON_MAIN: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          if [ "$ON_MAIN" = "true" ]; then
            grep -q cloudflareinsights dist/skill/index.html || { echo "main's build has no beacon"; exit 1; }
          elif grep -q cloudflareinsights dist/skill/index.html; then
            echo "A non-main build has the beacon"; exit 1
          fi
      # The deploy ships this exact build. It's uploaded before any other tool runs, so none can alter it.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps --only-shell chromium
        # It has stalled before. Fail fast rather than use up the job's limit.
        timeout-minutes: 5
      # Against the exact build above, served by the real Worker (wrangler dev).
      - run: pnpm test:e2e
      # One run of the heavy page. Uses the runner's preinstalled Chrome.
      - run: pnpm test:lighthouse
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          path: |
            playwright-report/
            test-results/
            lighthouse-reports/
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    name: Deploy to production
    # After the checks, and only for main. The secrets live in the production environment, which only
    # main can deploy to, so no PR can reach them.
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: production
      url: https://joshua.win/skill/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          cache: true
          require-lockfile: true
      # Ship the exact build the checks ran on.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
          command: deploy

  smoke:
    name: Smoke test production
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          cache: true
          require-lockfile: true
      - run: pnpm test:smoke
